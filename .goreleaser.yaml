# Release binaries with the web app embedded. The archive names are what action.yml downloads.
version: 2
before:
  hooks:
    - make web
builds:
  - main: ./cmd/shipwake
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: -s -w -X main.version={{ .Tag }}
archives:
  - name_template: shipwake_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  disable: true # release notes come from the annotated tag
release:
  mode: keep-existing
