# Push an annotated tag (v1.2.3) to draft a GitHub release with binaries; its message is the release
# notes. The draft is published by hand, once checked.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*'] # full versions: v1.2.3, v1.2.3-rc.1; not v1, which follows them
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: Notes from the tag
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^Approved-by:/d' > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
